# Terraform Provider release workflow.
name: Release

on:
  schedule:
    - cron: "0 18 * * 5" # At 18:00 on Friday.
  workflow_dispatch:

# Releases need permissions to read and write the repository contents.
# GitHub considers creating releases and uploading assets as writing contents.
permissions:
  contents: write

jobs:
  semantic_release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      new_release_git_tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configuration
        run: |
          cat > .releaserc.yml <<'EOF'
          branches:
            - main
          plugins:
            - - '@semantic-release/commit-analyzer'
              - releaseRules:
                  - type: chore
                    scope: deps
                    release: patch
          EOF

      - name: Semantic release
        id: semantic
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  goreleaser:
    name: GoReleaser
    needs: semantic_release
    if: needs.semantic_release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    # The signing key lives in this environment, which only main can deploy to.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GORELEASER_CURRENT_TAG: ${{ needs.semantic_release.outputs.new_release_git_tag }}

  oci:
    name: OCI
    needs: [semantic_release, goreleaser]
    runs-on: ubuntu-latest
    # Reads the release assets and pushes them to ghcr.io for OpenTofu's oci_mirror installation method.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Setup ORAS
        uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4
        with:
          version: 1.4.0

      - name: Push to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.semantic_release.outputs.new_release_git_tag }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          prefix=terraform-provider-tunnel_${version}_
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --pattern '*_SHA256SUMS'
          sha256sum --check --ignore-missing "${prefix}SHA256SUMS"
          # The layout follows https://opentofu.org/docs/cli/oci_registries/provider-mirror/: an index of one manifest
          # per platform, each holding the release zip as its only layer.
          platforms=()
          for zip in "$prefix"*.zip; do
            platform=${zip#"$prefix"}
            platform=${platform%.zip}
            oras push --oci-layout "layout:$platform" --artifact-type application/vnd.opentofu.provider-target \
              --artifact-platform "${platform/_//}" "$zip:archive/zip"
            platforms+=("$platform")
          done
          oras manifest index create --oci-layout "layout:$version" --artifact-type application/vnd.opentofu.provider \
            --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "${platforms[@]}"
          oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
          oras cp --from-oci-layout "layout:$version" "ghcr.io/$GITHUB_REPOSITORY:$version"
